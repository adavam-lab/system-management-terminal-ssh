# Servidor RustDesk propio (OSS) para XSSH Manager.
#   hbbs = servidor de IDs (registro y conexión directa P2P)
#   hbbr = relay (cuando el P2P no es posible)
#
# Uso, en el servidor (Linux con Docker):
#   docker compose up -d
#   cat data/id_ed25519.pub        # ← la "Key" que va en cada cliente RustDesk
#
# Puertos a abrir en el firewall / router:
#   21115/tcp, 21116/tcp, 21116/udp, 21117/tcp
services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
